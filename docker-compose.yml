services:
  savenein-db:
    image: postgis/postgis:18-3.6
    container_name: savenein-db
    network_mode: "host"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password # TODO: Change this
      POSTGRES_DB: savenein
    volumes:
      - postgres_data:/var/lib/postgresql

  savenein-db-gui:
    image: dbeaver/cloudbeaver:latest
    container_name: savenein-db-gui
    network_mode: "host"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - savenein-db

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: savenein_valhalla
    network_mode: "host"
    environment:
      - tile_urls=https://download.geofabrik.de/north-america/us/indiana-latest.osm.pbf https://download.geofabrik.de/north-america/us/ohio-latest.osm.pbf https://download.geofabrik.de/north-america/us/michigan-latest.osm.pbf https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf https://download.geofabrik.de/north-america/us/kentucky-latest.osm.pbf
      - build_admins=True
      - build_time_zones=True
      - build_elevation=False
      - build_tar=True
      - force_rebuild=False
      - server_threads=4
    volumes:
      - ./infra/valhalla/custom_files:/custom_files
      - ./infra/valhalla/osm:/osm:ro
    restart: unless-stopped

  savenein-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savenein-app
    network_mode: "host"
    environment:
      - ConnectionStrings__DefaultConnection=Host=127.0.0.1;Database=savenein;Username=postgres;Password=password
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - ArchiveBox__Enabled=${ARCHIVEBOX_ENABLED:-false}
      - ArchiveBox__InternalBaseUrl=http://127.0.0.1:8001
      - ArchiveBox__ApiToken=${ARCHIVEBOX_API_TOKEN:-}
      - ArchiveBox__CaptureAdminToken=${ARCHIVEBOX_CAPTURE_ADMIN_TOKEN:-}
      - ArchiveBox__DataPath=/var/lib/savenein/archivebox
    depends_on:
      - savenein-db
      - savenein-archivebox
    volumes:
      - archivebox_data:/var/lib/savenein/archivebox:ro

  savenein-archivebox:
    image: archivebox/archivebox@sha256:2ccfe19800291c41a0ae0f18f4a4735d4671e2fc2ddb933a7d1a0420911490ba
    container_name: savenein-archivebox
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      BASE_URL: http://127.0.0.1:8001
      SERVER_SECURITY_MODE: safe-onedomain-nojsreplay
      PUBLIC_ADD_VIEW: "False"
      PUBLIC_INDEX: "False"
      ADMIN_USERNAME: ${ARCHIVEBOX_ADMIN_USERNAME:-savenein}
      ADMIN_PASSWORD: ${ARCHIVEBOX_ADMIN_PASSWORD:-change-me-before-enabling}
    volumes:
      - archivebox_data:/data
      - archivebox_data:/data/personas
      - archivebox_tmp:/tmp/archivebox
    shm_size: "1gb"
    pids_limit: 2048
    restart: unless-stopped

volumes:
  postgres_data:
  cloudbeaver_data:
  archivebox_data:
  archivebox_tmp:
