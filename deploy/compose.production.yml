name: savenein

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: savefw
      POSTGRES_USER: savefw_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savefw_app -d savefw"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    restart: unless-stopped
    environment:
      tile_urls: >-
        https://download.geofabrik.de/north-america/us/indiana-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/ohio-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/michigan-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf
        https://download.geofabrik.de/north-america/us/kentucky-latest.osm.pbf
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_tar: "True"
      force_rebuild: "False"
      server_threads: "4"
    volumes:
      - ../infra/valhalla/custom_files:/custom_files
      - ../infra/valhalla/osm:/osm:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: savenein-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=savefw;Username=savefw_app;Password=${POSTGRES_PASSWORD}
      Valhalla__BaseUrl: http://valhalla:8002
      TigerSeeding__IngestAddressRanges: "false"
      DailySignupDigest__Enabled: ${DAILY_SIGNUP_DIGEST_ENABLED:-false}
      DailySignupDigest__TimeZoneId: ${DAILY_SIGNUP_DIGEST_TIME_ZONE_ID:-America/Indiana/Indianapolis}
      DailySignupDigest__DeliveryLocalTime: ${DAILY_SIGNUP_DIGEST_DELIVERY_LOCAL_TIME:-08:00}
      DailySignupDigest__SenderAddress: ${DAILY_SIGNUP_DIGEST_SENDER_ADDRESS:-outreach@savefw.com}
      DailySignupDigest__Recipients__0: ${DAILY_SIGNUP_DIGEST_RECIPIENT_0:-}
      DailySignupDigest__Recipients__1: ${DAILY_SIGNUP_DIGEST_RECIPIENT_1:-}
      DailySignupDigest__Recipients__2: ${DAILY_SIGNUP_DIGEST_RECIPIENT_2:-}
      DailySignupDigest__Recipients__3: ${DAILY_SIGNUP_DIGEST_RECIPIENT_3:-}
      DailySignupDigest__Recipients__4: ${DAILY_SIGNUP_DIGEST_RECIPIENT_4:-}
      ZohoMail__AccountId: ${ZOHO_MAIL_ACCOUNT_ID:-}
      ZohoMail__ClientId: ${ZOHO_MAIL_CLIENT_ID:-}
      ZohoMail__ClientSecret: ${ZOHO_MAIL_CLIENT_SECRET:-}
      ZohoMail__RefreshToken: ${ZOHO_MAIL_REFRESH_TOKEN:-}
      ZohoMail__ApiBaseUrl: ${ZOHO_MAIL_API_BASE_URL:-https://mail.zoho.com/api/}
      ZohoMail__TokenEndpoint: ${ZOHO_MAIL_TOKEN_ENDPOINT:-https://accounts.zoho.com/oauth/v2/token}
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    profiles: ["maintenance"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
