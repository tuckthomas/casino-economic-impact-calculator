name: Model license guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-model-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject un-licensed or improperly licensed model files
        run: npm run check:model-license
