name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run repository guards
        run: |
          npm run check:ui-text
          npm run check:tooltips
          npm run check:model-license

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore SaveNEIN.sln

      - name: Build .NET solution
        run: dotnet build SaveNEIN.sln --configuration Release --no-restore

      - name: Run server tests
        run: dotnet test SaveNEIN.Server.Tests/SaveNEIN.Server.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build production container image
        run: docker build --tag savenein-ci:${{ github.sha }} .
