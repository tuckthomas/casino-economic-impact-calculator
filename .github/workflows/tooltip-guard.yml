name: Tooltip component guard

on:
  push:
  pull_request:

jobs:
  check-tooltips:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce canonical tooltips
        run: npm run check:tooltips
