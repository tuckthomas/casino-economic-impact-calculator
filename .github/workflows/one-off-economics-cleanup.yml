name: One-off economics cleanup

on:
  push:
    branches:
      - agent/remove-economics-workarounds

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace workaround with local model context
        shell: python
        run: |
          from pathlib import Path

          calculator = Path("SaveNEIN.Client/wwwroot/js/economics/calculator.js")
          text = calculator.read_text(encoding="utf-8")

          old_catch = """        catch (err)\n        {\n            console.warn('[Calculator] Municipality lookup failed:', err);\n\n            if (seq !== municipalityLookupSeq)\n            {\n                return impactDetail.municipality || null;\n            }\n\n            lastMunicipalityLookupKey = lookupKey;\n            lastMunicipalityLookupValue = fallback;\n            impactDetail.municipality = { ...fallback };\n            return impactDetail.municipality;\n        }\n"""
          new_catch = """        catch (err)\n        {\n            console.error('[Calculator] Municipality lookup failed; tax allocation cannot be evaluated safely:', err);\n\n            if (seq !== municipalityLookupSeq)\n            {\n                return impactDetail.municipality || null;\n            }\n\n            throw err;\n        }\n"""
          if text.count(old_catch) != 1:
              raise SystemExit("Expected exactly one municipality fallback catch block")
          text = text.replace(old_catch, new_catch, 1)

          old_subject = '        const subjectCountyName = String((model && model.subjectCountyName) || "").trim();\n'
          new_subject = old_subject + "        const cleanSubjectCountyName = subjectCountyName.replace(/\\s+County$/i, '').trim();\n        const formattedCountyName = `${cleanSubjectCountyName || 'Subject'} County`;\n"
          if text.count(old_subject) != 1:
              raise SystemExit("Expected exactly one table subjectCountyName declaration")
          text = text.replace(old_subject, new_subject, 1)
          calculator.write_text(text, encoding="utf-8")

          for shell_path in [
              Path("SaveNEIN.Server/Pages/Index.cshtml"),
              Path("SaveNEIN.Client/wwwroot/index.html"),
          ]:
              shell = shell_path.read_text(encoding="utf-8")
              lines = [line for line in shell.splitlines() if 'js/economics/location-context.js' not in line]
              shell_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          workaround = Path("SaveNEIN.Client/wwwroot/js/economics/location-context.js")
          if workaround.exists():
              workaround.unlink()

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(economics): remove hidden county and municipality fallbacks"
          git push origin HEAD:agent/remove-economics-workarounds
