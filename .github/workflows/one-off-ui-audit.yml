name: One-off UI audit

on:
  push:
    branches:
      - agent/issues-10-11-ui-standardization

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit tooltip and custom dropdown patterns
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('SaveNEIN.Client'), Path('SaveNEIN.Server')]
          ignored_parts = {'node_modules', 'bin', 'obj'}
          ignored_prefixes = [
              Path('SaveNEIN.Client/wwwroot/js/lib'),
              Path('SaveNEIN.Client/wwwroot/css'),
          ]
          text_exts = {'.razor', '.cshtml', '.html', '.js', '.mjs', '.ts', '.css', '.cs'}

          tooltip_patterns = [
              ('TooltipPortal', re.compile(r'TooltipPortal')),
              ('title=', re.compile(r'\btitle\s*=')),
              ('data-tooltip', re.compile(r'data-tooltip')),
              ('aria-describedby', re.compile(r'aria-describedby')),
              ('cursor-help', re.compile(r'cursor-help')),
              ('tooltip', re.compile(r'tooltip', re.I)),
          ]
          custom_patterns = [
              ('>Custom<', re.compile(r'>\s*Custom\s*<')),
              ('Custom literal', re.compile(r"['\"]Custom['\"]")),
              ('__custom__', re.compile(r'__custom__')),
              ('custom option', re.compile(r'custom.{0,30}option|option.{0,30}custom', re.I)),
          ]

          files = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_exts:
                      continue
                  if any(part in ignored_parts for part in path.parts):
                      continue
                  if any(str(path).startswith(str(prefix)) for prefix in ignored_prefixes):
                      continue
                  files.append(path)

          def scan(label, patterns):
              print(f'=== {label} ===')
              count = 0
              for path in sorted(files):
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(lines, 1):
                      if any(rx.search(line) for _, rx in patterns):
                          print(f'{path}:{lineno}:{line.strip()}')
                          count += 1
              print(f'=== {label} MATCH COUNT: {count} ===')

          scan('TOOLTIP PATTERNS', tooltip_patterns)
          scan('CUSTOM DROPDOWN / SELECT PATTERNS', custom_patterns)
