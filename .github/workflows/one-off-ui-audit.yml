name: One-off UI audit

on:
  push:
    branches:
      - agent/issues-10-11-ui-standardization

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Audit tooltip and custom dropdown patterns
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('SaveNEIN.Client'), Path('SaveNEIN.Server')]
          ignored_parts = {'node_modules', 'bin', 'obj'}
          ignored_prefixes = [Path('SaveNEIN.Client/wwwroot/js/lib'), Path('SaveNEIN.Client/wwwroot/css')]
          text_exts = {'.razor', '.cshtml', '.html', '.js', '.mjs', '.ts', '.css', '.cs'}
          tooltip_patterns = [
              re.compile(r'TooltipPortal'), re.compile(r'\btitle\s*='), re.compile(r'data-tooltip'),
              re.compile(r'aria-describedby'), re.compile(r'cursor-help'), re.compile(r'tooltip', re.I)
          ]
          custom_patterns = [
              re.compile(r'>\s*Custom\s*<'), re.compile(r"['\"]Custom['\"]"),
              re.compile(r'__custom__'), re.compile(r'custom.{0,30}option|option.{0,30}custom', re.I)
          ]
          files = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_exts: continue
                  if any(part in ignored_parts for part in path.parts): continue
                  if any(str(path).startswith(str(prefix)) for prefix in ignored_prefixes): continue
                  files.append(path)

          out = []
          def scan(label, patterns):
              out.append(f'=== {label} ===')
              count = 0
              for path in sorted(files):
                  try: lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError: continue
                  for lineno, line in enumerate(lines, 1):
                      if any(rx.search(line) for rx in patterns):
                          out.append(f'{path}:{lineno}:{line.strip()}')
                          count += 1
              out.append(f'=== {label} MATCH COUNT: {count} ===')
          scan('TOOLTIP PATTERNS', tooltip_patterns)
          scan('CUSTOM DROPDOWN / SELECT PATTERNS', custom_patterns)
          Path('.audit-results.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-results.txt
          git commit -m "chore: record UI audit results" || exit 0
          git push
