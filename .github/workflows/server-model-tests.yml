name: Server model tests

on:
  push:
    branches:
      - feature/sector-weighted-casino-displacement-model-and-revenue-projections-model
    paths:
      - 'SaveNEIN.Server/**'
      - 'SaveNEIN.Server.Tests/**'
      - '.github/workflows/server-model-tests.yml'
  pull_request:
    paths:
      - 'SaveNEIN.Server/**'
      - 'SaveNEIN.Server.Tests/**'
      - '.github/workflows/server-model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore server tests
        run: dotnet restore SaveNEIN.Server.Tests/SaveNEIN.Server.Tests.csproj
      - name: Build server tests
        run: dotnet build SaveNEIN.Server.Tests/SaveNEIN.Server.Tests.csproj --configuration Release --no-restore
      - name: Run server tests
        run: dotnet test SaveNEIN.Server.Tests/SaveNEIN.Server.Tests.csproj --configuration Release --no-build --verbosity normal
