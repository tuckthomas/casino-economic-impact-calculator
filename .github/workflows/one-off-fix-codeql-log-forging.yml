name: One-off fix CodeQL log forging

on:
  push:
    branches:
      - agent/codeql-log-forging

permissions:
  contents: write
  security-events: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply log-forging fixes
        shell: python
        run: |
          from pathlib import Path

          client = Path('SaveNEIN.Server/Controllers/ClientLogController.cs')
          text = client.read_text(encoding='utf-8')
          old = '        _logger.LogInformation($"[CLIENT-LOG] {entry.Message}");'
          new = ('        var safeMessage = entry.Message\n'
                 '            .Replace("\\r", string.Empty)\n'
                 '            .Replace("\\n", string.Empty);\n'
                 '        _logger.LogInformation("[CLIENT-LOG] {ClientMessage}", safeMessage);')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one ClientLogController sink, found {text.count(old)}')
          client.write_text(text.replace(old, new), encoding='utf-8')

          impact = Path('SaveNEIN.Server/Controllers/ImpactController.cs')
          text = impact.read_text(encoding='utf-8')

          replacements = [
              ('    {\n        _logger.LogInformation($"[ImpactController] 1. Request received for {fips} (Lite: {lite})");\n        try',
               '    {\n        var safeFipsForLog = fips\n            .Replace("\\r", string.Empty)\n            .Replace("\\n", string.Empty);\n        _logger.LogInformation("[ImpactController] 1. Request received for {Fips} (Lite: {Lite})", safeFipsForLog, lite);\n        try'),
              ('            _logger.LogWarning($"[ImpactController] No data found for {fips}");',
               '            _logger.LogWarning("[ImpactController] No data found for {Fips}", safeFipsForLog);'),
              ('        _logger.LogError(ex, $"[ImpactController] Error in GetCountyContext for {fips}");',
               '        _logger.LogError(ex, "[ImpactController] Error in GetCountyContext for {Fips}", safeFipsForLog);'),
              ('    {\n        try\n        {\n            // Defaults align with appsettings for now',
               '    {\n        var safeStateFipsForLog = (stateFips ?? "18")\n            .Replace("\\r", string.Empty)\n            .Replace("\\n", string.Empty);\n        var safeTitleForLog = (title ?? "Allen")\n            .Replace("\\r", string.Empty)\n            .Replace("\\n", string.Empty);\n\n        try\n        {\n            // Defaults align with appsettings for now'),
              ('            _logger.LogError(ex, $"[ImpactController] Error in GetGridPoints for {title}, {stateFips}");',
               '            _logger.LogError(ex, "[ImpactController] Error in GetGridPoints for {CountyTitle}, {StateFips}", safeTitleForLog, safeStateFipsForLog);')
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one ImpactController replacement, found {text.count(old)}')
              text = text.replace(old, new, 1)

          impact.write_text(text, encoding='utf-8')

      - name: Build release
        run: dotnet build SaveNEIN.Server/SaveNEIN.Server.csproj -c Release

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyze C# without upload
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Verify log-forging findings are gone
        shell: python
        run: |
          import glob, json
          paths = glob.glob('sarif-results/**/*.sarif', recursive=True)
          if not paths:
              raise SystemExit('No SARIF output found')
          hits = []
          for path in paths:
              data = json.load(open(path, encoding='utf-8'))
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      if result.get('ruleId') == 'cs/log-forging':
                          loc = result.get('locations', [{}])[0].get('physicalLocation', {})
                          hits.append((loc.get('artifactLocation', {}).get('uri'), loc.get('region', {}).get('startLine')))
          if hits:
              raise SystemExit(f'cs/log-forging still present: {hits}')
          print('No cs/log-forging results remain.')

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SaveNEIN.Server/Controllers/ClientLogController.cs SaveNEIN.Server/Controllers/ImpactController.cs
          git commit -m "fix(security): sanitize user-controlled log values"
          git push
