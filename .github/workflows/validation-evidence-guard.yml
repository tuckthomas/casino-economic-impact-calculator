name: Validation evidence integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify captured bytes and checksum references
        run: |
          node --test scripts/validation/validation-evidence.test.mjs scripts/validation/audit-unreconciled-revenue-scope.test.mjs
          node scripts/check-validation-evidence.mjs
