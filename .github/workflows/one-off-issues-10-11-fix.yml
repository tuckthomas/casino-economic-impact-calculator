name: One-off issues 10 and 11 fix

on:
  push:
    branches:
      - agent/issues-10-11-ui-standardization

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI standardization
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def insert_after_element_id(text, element_id, markup, closing_tag):
              marker = f'id="{element_id}"'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Missing element id {element_id}')
              end = text.find(closing_tag, start)
              if end < 0:
                  raise SystemExit(f'Missing {closing_tag} after {element_id}')
              end += len(closing_tag)
              return text[:end] + '\n' + markup + text[end:]

          # Canonical Blazor tooltip component. TargetId mode standardizes an existing
          # control; default mode renders the standard information icon trigger.
          write('SaveNEIN.Client/Components/AppTooltip.razor', r'''@inject IJSRuntime JSRuntime
          @implements IAsyncDisposable

          @if (string.IsNullOrWhiteSpace(TargetId))
          {
              <span @ref="hostRef" class="@HostClass">
                  <button type="button"
                          class="@TriggerClass"
                          aria-label="@AriaLabel">
                      <span class="material-symbols-outlined text-[16px] leading-none" aria-hidden="true">@Icon</span>
                  </button>
              </span>
          }

          @code {
              [Parameter, EditorRequired] public string Text { get; set; } = string.Empty;
              [Parameter] public string? TargetId { get; set; }
              [Parameter] public string AriaLabel { get; set; } = "More information";
              [Parameter] public string Icon { get; set; } = "info";
              [Parameter] public string HostClass { get; set; } = "inline-flex items-center";
              [Parameter] public string TriggerClass { get; set; } = "inline-flex items-center justify-center rounded-sm text-slate-400 hover:text-blue-500 transition-colors cursor-help focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60";

              private ElementReference hostRef;

              protected override async Task OnAfterRenderAsync(bool firstRender)
              {
                  if (string.IsNullOrWhiteSpace(Text))
                  {
                      return;
                  }

                  if (!string.IsNullOrWhiteSpace(TargetId))
                  {
                      await JSRuntime.InvokeVoidAsync("AppTooltip.attachById", TargetId, Text);
                  }
                  else
                  {
                      await JSRuntime.InvokeVoidAsync("AppTooltip.attach", hostRef, Text);
                  }
              }

              public async ValueTask DisposeAsync()
              {
                  try
                  {
                      if (!string.IsNullOrWhiteSpace(TargetId))
                      {
                          await JSRuntime.InvokeVoidAsync("AppTooltip.detachById", TargetId);
                      }
                      else
                      {
                          await JSRuntime.InvokeVoidAsync("AppTooltip.detach", hostRef);
                      }
                  }
                  catch (JSDisconnectedException)
                  {
                  }
              }
          }
          '''.replace('          ', ''))

          # Canonical portal implementation used by both AppTooltip.razor and JS-created controls.
          write('SaveNEIN.Client/wwwroot/js/components/tooltip-portal.js', r'''/**
           * Canonical SaveNEIN tooltip portal.
           * App-owned Blazor UI should consume AppTooltip.razor. Controls created dynamically
           * by JavaScript use window.AppTooltip.attach so both paths share identical behavior.
           */
          window.TooltipPortal = (function ()
          {
              'use strict';

              const bindings = new WeakMap();
              let portalEl = null;
              let arrowEl = null;
              let hideTimeout = null;
              let currentTrigger = null;
              let describedElement = null;
              let previousDescribedBy = null;

              function ensurePortal()
              {
                  if (portalEl) return portalEl;

                  portalEl = document.createElement('div');
                  portalEl.id = 'app-tooltip-portal';
                  portalEl.setAttribute('role', 'tooltip');
                  portalEl.style.cssText = `
                      position: fixed;
                      z-index: 99999;
                      pointer-events: none;
                      opacity: 0;
                      transition: opacity 0.15s ease;
                      max-width: 220px;
                      padding: 8px 12px;
                      background: #0f172a;
                      color: #f1f5f9;
                      font-size: 12px;
                      line-height: 1.4;
                      border-radius: 8px;
                      border: 1px solid #334155;
                      box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.3);
                      text-align: center;
                      font-weight: 400;
                      text-transform: none;
                      letter-spacing: normal;
                      white-space: normal;
                      word-wrap: break-word;
                  `;

                  arrowEl = document.createElement('div');
                  arrowEl.setAttribute('aria-hidden', 'true');
                  arrowEl.style.cssText = `
                      position: absolute;
                      width: 0;
                      height: 0;
                      border-left: 6px solid transparent;
                      border-right: 6px solid transparent;
                  `;
                  portalEl.appendChild(arrowEl);

                  const textEl = document.createElement('span');
                  textEl.className = 'tooltip-portal-text';
                  portalEl.appendChild(textEl);
                  document.body.appendChild(portalEl);

                  window.addEventListener('scroll', hide, true);
                  window.addEventListener('resize', hide, { passive: true });
                  return portalEl;
              }

              function clearDescription()
              {
                  if (!describedElement) return;
                  if (previousDescribedBy)
                  {
                      describedElement.setAttribute('aria-describedby', previousDescribedBy);
                  }
                  else if (describedElement.getAttribute('aria-describedby') === 'app-tooltip-portal')
                  {
                      describedElement.removeAttribute('aria-describedby');
                  }
                  describedElement = null;
                  previousDescribedBy = null;
              }

              function positionTooltip(triggerEl)
              {
                  if (!portalEl || !triggerEl) return;
                  const rect = triggerEl.getBoundingClientRect();
                  const portalRect = portalEl.getBoundingClientRect();
                  const gap = 8;
                  let top = rect.top - portalRect.height - gap;
                  let placeBelow = false;
                  if (top < 4)
                  {
                      top = rect.bottom + gap;
                      placeBelow = true;
                  }

                  let left = rect.left + rect.width / 2 - portalRect.width / 2;
                  const viewportWidth = window.innerWidth;
                  if (left < 8) left = 8;
                  if (left + portalRect.width > viewportWidth - 8) left = viewportWidth - portalRect.width - 8;

                  portalEl.style.top = `${top}px`;
                  portalEl.style.left = `${left}px`;

                  if (placeBelow)
                  {
                      arrowEl.style.top = '-6px';
                      arrowEl.style.bottom = '';
                      arrowEl.style.borderBottom = '6px solid #0f172a';
                      arrowEl.style.borderTop = 'none';
                  }
                  else
                  {
                      arrowEl.style.bottom = '-6px';
                      arrowEl.style.top = '';
                      arrowEl.style.borderTop = '6px solid #0f172a';
                      arrowEl.style.borderBottom = 'none';
                  }

                  const arrowLeft = rect.left + rect.width / 2 - left - 6;
                  arrowEl.style.left = `${Math.max(6, Math.min(arrowLeft, portalRect.width - 18))}px`;
              }

              function show(triggerEl, content, accessibilityTarget)
              {
                  if (!triggerEl || !content) return;
                  clearTimeout(hideTimeout);
                  ensurePortal();
                  clearDescription();

                  currentTrigger = triggerEl;
                  const textEl = portalEl.querySelector('.tooltip-portal-text');
                  textEl.textContent = String(content);

                  describedElement = accessibilityTarget instanceof Element ? accessibilityTarget : triggerEl;
                  previousDescribedBy = describedElement.getAttribute('aria-describedby');
                  const ids = new Set((previousDescribedBy || '').split(/\s+/).filter(Boolean));
                  ids.add(portalEl.id);
                  describedElement.setAttribute('aria-describedby', Array.from(ids).join(' '));

                  portalEl.style.opacity = '0';
                  portalEl.style.display = 'block';
                  requestAnimationFrame(() =>
                  {
                      if (currentTrigger !== triggerEl) return;
                      positionTooltip(triggerEl);
                      portalEl.style.opacity = '1';
                  });
              }

              function hide()
              {
                  if (!portalEl) return;
                  clearTimeout(hideTimeout);
                  hideTimeout = setTimeout(() =>
                  {
                      portalEl.style.opacity = '0';
                      currentTrigger = null;
                      clearDescription();
                  }, 50);
              }

              function detach(triggerEl)
              {
                  if (!triggerEl) return;
                  const binding = bindings.get(triggerEl);
                  if (binding)
                  {
                      for (const [eventName, handler] of binding.handlers)
                      {
                          triggerEl.removeEventListener(eventName, handler);
                      }
                      bindings.delete(triggerEl);
                  }
                  triggerEl.removeAttribute('data-app-tooltip-bound');
                  if (currentTrigger === triggerEl) hide();
              }

              function attach(triggerEl, content)
              {
                  if (!triggerEl || !content) return;
                  detach(triggerEl);
                  const tooltipText = String(content);
                  const handlers = [];
                  const on = (eventName, handler) =>
                  {
                      triggerEl.addEventListener(eventName, handler);
                      handlers.push([eventName, handler]);
                  };

                  on('mouseenter', () => show(triggerEl, tooltipText, triggerEl));
                  on('mouseleave', hide);
                  on('focusin', event => show(triggerEl, tooltipText, event.target));
                  on('focusout', event =>
                  {
                      if (!event.relatedTarget || !triggerEl.contains(event.relatedTarget)) hide();
                  });
                  on('keydown', event =>
                  {
                      if (event.key === 'Escape') hide();
                  });
                  on('pointerdown', event =>
                  {
                      if (event.pointerType === 'touch')
                      {
                          show(triggerEl, tooltipText, event.target);
                          window.setTimeout(hide, 2200);
                      }
                  });

                  bindings.set(triggerEl, { handlers });
                  triggerEl.setAttribute('data-app-tooltip-bound', 'true');
              }

              function attachById(id, content)
              {
                  const element = document.getElementById(id);
                  if (element) attach(element, content);
              }

              function detachById(id)
              {
                  const element = document.getElementById(id);
                  if (element) detach(element);
              }

              const portalApi = { show, hide, attach, detach, attachById, detachById };
              window.AppTooltip = { attach, detach, attachById, detachById, hide };
              return portalApi;
          })();
          '''.replace('          ', ''))

          # Issue #10 and PresetInput tooltip migration.
          path = 'SaveNEIN.Client/Components/PresetInput.razor'
          text = read(path)
          old = '''        @if (!string.IsNullOrEmpty(Tooltip))\n        {\n            <div class="relative flex items-center">\n                <span class="material-symbols-outlined text-slate-400 text-[16px] cursor-help hover:text-blue-500 transition-colors"\n                      onmouseenter="TooltipPortal.show(this, '@Tooltip.Replace("'", "\\\\'").Replace("\\\"", "&quot;")')"\n                      onmouseleave="TooltipPortal.hide()">info</span>\n            </div>\n        }'''
          new = '''        @if (!string.IsNullOrEmpty(Tooltip))\n        {\n            <AppTooltip Text="@Tooltip" AriaLabel="@($"More information about {Label}")" />\n        }'''
          text = replace_once(text, old, new, 'PresetInput tooltip')
          old = '''                @foreach (var preset in PresetOptions)\n                {\n                    <option value="@preset.Value">@preset.Label</option>\n                }\n                <option value="@CustomPresetValue">Custom</option>'''
          new = '''                <option value="@CustomPresetValue">Custom</option>\n                @foreach (var preset in PresetOptions)\n                {\n                    <option value="@preset.Value">@preset.Label</option>\n                }'''
          text = replace_once(text, old, new, 'PresetInput native Custom ordering')
          old = '''                        @foreach (var preset in PresetOptions)\n                        {\n                            var isActive = string.Equals(selectedPresetValue, preset.Value, StringComparison.Ordinal);\n                            <button type="button"\n                                    class="sfw-custom-select-option @(isActive ? "is-active" : "")"\n                                    @onclick="(() => SelectDesktopPresetAsync(preset.Value))">\n                                @preset.Label\n                            </button>\n                        }\n                        <button type="button"\n                                class="sfw-custom-select-option @(string.Equals(selectedPresetValue, CustomPresetValue, StringComparison.Ordinal) ? "is-active" : "")"\n                                @onclick="(() => SelectDesktopPresetAsync(CustomPresetValue))">\n                            Custom\n                        </button>'''
          new = '''                        <button type="button"\n                                class="sfw-custom-select-option @(string.Equals(selectedPresetValue, CustomPresetValue, StringComparison.Ordinal) ? "is-active" : "")"\n                                @onclick="(() => SelectDesktopPresetAsync(CustomPresetValue))">\n                            Custom\n                        </button>\n                        <div role="separator" aria-hidden="true" class="mx-2 my-1 border-t border-slate-700"></div>\n                        @foreach (var preset in PresetOptions)\n                        {\n                            var isActive = string.Equals(selectedPresetValue, preset.Value, StringComparison.Ordinal);\n                            <button type="button"\n                                    class="sfw-custom-select-option @(isActive ? "is-active" : "")"\n                                    @onclick="(() => SelectDesktopPresetAsync(preset.Value))">\n                                @preset.Label\n                            </button>\n                        }'''
          text = replace_once(text, old, new, 'PresetInput visible Custom ordering')
          write(path, text)

          # Issue #10 tax-allocation dropdown ordering + separator.
          path = 'SaveNEIN.Client/wwwroot/js/economics/calculator.js'
          text = read(path)
          old = '''        const options = [\n            ...getPresetTaxScenarios().map(scenario => ({\n                id: scenario.id,\n                label: scenario.billName ? `${scenario.label} (${scenario.billName})` : scenario.label\n            })),\n            { id: TAX_ALLOCATION_SCENARIO_CUSTOM_ID, label: 'Custom' }\n        ];'''
          new = '''        const options = [\n            { id: TAX_ALLOCATION_SCENARIO_CUSTOM_ID, label: 'Custom' },\n            ...getPresetTaxScenarios().map(scenario => ({\n                id: scenario.id,\n                label: scenario.billName ? `${scenario.label} (${scenario.billName})` : scenario.label\n            }))\n        ];'''
          text = replace_once(text, old, new, 'tax scenario Custom ordering')
          old = '''            scenarioMenu.innerHTML = options.map(option => `\n                <button type="button"\n                    role="option"\n                    aria-selected="${option.id === selectedTaxScenarioId ? 'true' : 'false'}"\n                    data-tax-scenario-id="${escapeHtml(option.id)}"\n                    class="sfw-custom-select-option ${option.id === selectedTaxScenarioId ? 'is-active' : ''}">\n                    ${escapeHtml(option.label)}\n                </button>\n            `).join('');'''
          new = '''            scenarioMenu.innerHTML = options.map((option, index) => `\n                <button type="button"\n                    role="option"\n                    aria-selected="${option.id === selectedTaxScenarioId ? 'true' : 'false'}"\n                    data-tax-scenario-id="${escapeHtml(option.id)}"\n                    class="sfw-custom-select-option ${option.id === selectedTaxScenarioId ? 'is-active' : ''}">\n                    ${escapeHtml(option.label)}\n                </button>\n                ${index === 0 ? '<div role="separator" aria-hidden="true" class="mx-2 my-1 border-t border-slate-700"></div>' : ''}\n            `).join('');'''
          text = replace_once(text, old, new, 'tax scenario separator')

          # Replace the separate economic-calculator tooltip implementation with the canonical portal.
          block_start = text.index('    let globalTooltip = null;')
          block_end = text.index('    function positionOtherCountiesToggle()', block_start)
          replacement = '''    let otherCountiesToggleEl = null;\n    let otherCountiesToggleState = null;\n    let otherCountiesToggleResizeBound = false;\n\n'''
          text = text[:block_start] + replacement + text[block_end:]
          text = text.replace('        hideTooltip();', '        window.AppTooltip && window.AppTooltip.hide();')
          old = '''        const hideTooltip = "window.EconomicCalculator && window.EconomicCalculator.hideTooltip && window.EconomicCalculator.hideTooltip();";\n\n        otherCountiesToggleEl.innerHTML = `\n            <span class="${lineClass}"></span>\n            <button type="button"\n                onclick="window.EconomicCalculator && window.EconomicCalculator.toggleOtherCounties && window.EconomicCalculator.toggleOtherCounties()"\n                onmouseenter="window.EconomicCalculator && window.EconomicCalculator.showTooltip && window.EconomicCalculator.showTooltip(event, 'Click to ${label} each of the ${count} counties costs.')"\n                onmouseleave="${hideTooltip} ${activeRelease}"\n                onmousemove="window.EconomicCalculator && window.EconomicCalculator.moveTooltip && window.EconomicCalculator.moveTooltip(event)"\n                onmousedown="${activePress}"\n                onmouseup="${activeRelease}"\n                onmouseleave="${activeRelease}"\n                style="transform: translate(-50%, -50%);"\n                class="${buttonClass}">${expanded ? '−' : '+'}</button>\n        `;'''
          new = '''        otherCountiesToggleEl.innerHTML = `\n            <span class="${lineClass}"></span>\n            <button type="button"\n                aria-label="${expanded ? 'Hide' : 'View'} county cost details"\n                onclick="window.EconomicCalculator && window.EconomicCalculator.toggleOtherCounties && window.EconomicCalculator.toggleOtherCounties()"\n                onmousedown="${activePress}"\n                onmouseup="${activeRelease}"\n                onmouseleave="${activeRelease}"\n                style="transform: translate(-50%, -50%);"\n                class="${buttonClass}">${expanded ? '−' : '+'}</button>\n        `;\n\n        const toggleButtonEl = otherCountiesToggleEl.querySelector('button');\n        if (toggleButtonEl && window.AppTooltip)\n        {\n            window.AppTooltip.attach(toggleButtonEl, `Click to ${label} each of the ${count} counties costs.`);\n        }'''
          text = replace_once(text, old, new, 'economic other-counties tooltip')
          text = text.replace('        showTooltip: showTooltip,\n        hideTooltip: hideTooltip,\n        moveTooltip: moveTooltip,\n', '')
          write(path, text)

          # Existing static Blazor controls: remove browser-native hover titles and bind AppTooltip.
          static_targets = [
              ('SaveNEIN.Client/Layout/MainLayout.razor', 'title="View Source on GitHub">', 'id="main-github-source-link" aria-label="View Source on GitHub">', 'main-github-source-link', 'View Source on GitHub', '</a>'),
              ('SaveNEIN.Client/Layout/NavMenu.razor', '<button title="Navigation menu" class="navbar-toggler"', '<button id="nav-menu-toggle" aria-label="Navigation menu" class="navbar-toggler"', 'nav-menu-toggle', 'Navigation menu', '</button>'),
              ('SaveNEIN.Client/Pages/EconomicImpact.razor', '                                title="Download PDF Report"\n', '                                aria-label="Download PDF Report"\n', 'btn-generate-pdf', 'Download PDF Report', '</button>'),
              ('SaveNEIN.Client/Pages/Map.razor', 'class="absolute top-3 right-3 text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors pointer-events-auto" title="Dismiss hint" aria-label="Dismiss guide"', 'class="absolute top-3 right-3 text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors pointer-events-auto" aria-label="Dismiss guide"', 'guidance-dismiss-btn', 'Dismiss hint', '</button>'),
          ]
          for path, old, new, element_id, tooltip, closing in static_targets:
              source = read(path)
              source = replace_once(source, old, new, f'{path} native title')
              source = insert_after_element_id(source, element_id, f'        <AppTooltip TargetId="{element_id}" Text="{tooltip}" />', closing)
              write(path, source)

          # Home has two identical GitHub icon links; give each a stable target id.
          path = 'SaveNEIN.Client/Pages/Home.razor'
          text = read(path)
          needle = 'title="View Source on GitHub" aria-label="View Source on GitHub">'
          if text.count(needle) != 2:
              raise SystemExit(f'Home GitHub titles: expected 2, found {text.count(needle)}')
          text = text.replace(needle, 'id="home-mobile-github-source" aria-label="View Source on GitHub">', 1)
          text = text.replace(needle, 'id="home-desktop-github-source" aria-label="View Source on GitHub">', 1)
          text = insert_after_element_id(text, 'home-mobile-github-source', '                        <AppTooltip TargetId="home-mobile-github-source" Text="View Source on GitHub" />', '</a>')
          text = insert_after_element_id(text, 'home-desktop-github-source', '                    <AppTooltip TargetId="home-desktop-github-source" Text="View Source on GitHub" />', '</a>')
          write(path, text)

          # Flipbook modal controls.
          path = 'SaveNEIN.Client/Pages/Modals.razor'
          text = read(path)
          text = replace_once(text, '<a href="assets/Independent_Analysis_Allen_County_Casino.pdf" download target="_blank"', '<a id="flipbook-download-pdf" href="assets/Independent_Analysis_Allen_County_Casino.pdf" download target="_blank"', 'flipbook download id')
          text = replace_once(text, '        title="Download PDF">', '        aria-label="Download PDF">', 'flipbook download title')
          text = insert_after_element_id(text, 'flipbook-download-pdf', '    <AppTooltip TargetId="flipbook-download-pdf" Text="Download PDF" />', '</a>')
          text = replace_once(text, '<button onclick="if(flipbookInstance) flipbookInstance.flipPrev()"', '<button id="flipbook-prev-page" aria-label="Previous Page" onclick="if(flipbookInstance) flipbookInstance.flipPrev()"', 'flipbook prev id')
          text = replace_once(text, '        title="Previous Page">', '>', 'flipbook prev title')
          text = insert_after_element_id(text, 'flipbook-prev-page', '    <AppTooltip TargetId="flipbook-prev-page" Text="Previous Page" />', '</button>')
          text = replace_once(text, '<button onclick="if(flipbookInstance) flipbookInstance.flipNext()"', '<button id="flipbook-next-page" aria-label="Next Page" onclick="if(flipbookInstance) flipbookInstance.flipNext()"', 'flipbook next id')
          text = replace_once(text, '        title="Next Page">', '>', 'flipbook next title')
          text = insert_after_element_id(text, 'flipbook-next-page', '    <AppTooltip TargetId="flipbook-next-page" Text="Next Page" />', '</button>')
          write(path, text)

          # MapLibre-created controls consume the same canonical tooltip portal through AppTooltip JS facade.
          path = 'SaveNEIN.Client/wwwroot/js/components/maplibre-map.js'
          text = read(path)
          replacements = [
              ("        fsBtn.title = 'Toggle Fullscreen';", "        fsBtn.setAttribute('aria-label', 'Toggle Fullscreen');\n        window.AppTooltip && window.AppTooltip.attach(fsBtn, 'Toggle Fullscreen');", 'fullscreen tooltip'),
              ("        layerBtn.title = 'Change Map Style';", "        layerBtn.setAttribute('aria-label', 'Change Map Style');\n        window.AppTooltip && window.AppTooltip.attach(layerBtn, 'Change Map Style');", 'layer tooltip'),
              ("            card.title = config.name;", "            window.AppTooltip && window.AppTooltip.attach(card, config.name);", 'basemap card tooltip'),
              ("        menuBtn.title = 'Layer Options';", "        menuBtn.setAttribute('aria-label', 'Layer Options');\n        window.AppTooltip && window.AppTooltip.attach(menuBtn, 'Layer Options');", 'menu tooltip'),
              ("        toggleBtn.title = 'Drawing Tools';", "        window.AppTooltip && window.AppTooltip.attach(toggleBtn, 'Drawing Tools');", 'drawing toggle tooltip'),
              ("            btn.title = m.title;", "            window.AppTooltip && window.AppTooltip.attach(btn, m.title);", 'drawing mode tooltip'),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          old = "            buildingsToggle.closest('.toggle-row')?.classList.toggle('is-disabled', !buildingsSupported);\n            buildingsToggle.closest('.toggle-row')?.setAttribute('title', buildingsSupported ? '' : '3D buildings require the Streets or Terrain basemap.');"
          new = "            const buildingsRow = buildingsToggle.closest('.toggle-row');\n            buildingsRow?.classList.toggle('is-disabled', !buildingsSupported);\n            if (buildingsRow && window.AppTooltip)\n            {\n                if (buildingsSupported) window.AppTooltip.detach(buildingsRow);\n                else window.AppTooltip.attach(buildingsRow, '3D buildings require the Streets or Terrain basemap.');\n            }"
          text = replace_once(text, old, new, '3D buildings tooltip')
          write(path, text)

          # Read-only numeric input tooltip uses the canonical portal rather than native title.
          path = 'SaveNEIN.Client/wwwroot/js/components/slider-input-logic.js'
          text = read(path)
          old = "                textInput.title = isReadOnly ? 'Select Custom to edit' : '';"
          new = "                if (window.AppTooltip)\n                {\n                    if (isReadOnly) window.AppTooltip.attach(textInput, 'Select Custom to edit');\n                    else window.AppTooltip.detach(textInput);\n                }"
          text = replace_once(text, old, new, 'slider readonly tooltip')
          write(path, text)

          # Central enforcement script. Semantic titles such as iframe/SVG titles are allowed;
          # app-owned interactive browser-native tooltips are not.
          write('scripts/check-tooltips.mjs', r'''import fs from 'node:fs';
          import path from 'node:path';

          const roots = ['SaveNEIN.Client'];
          const ignored = [
            `${path.sep}bin${path.sep}`,
            `${path.sep}obj${path.sep}`,
            `${path.sep}node_modules${path.sep}`,
            `${path.sep}wwwroot${path.sep}js${path.sep}lib${path.sep}`,
            `${path.sep}wwwroot${path.sep}lib${path.sep}`
          ];
          const allowedDirectPortalFile = path.normalize('SaveNEIN.Client/wwwroot/js/components/tooltip-portal.js');
          const allowedCursorHelpFile = path.normalize('SaveNEIN.Client/Components/AppTooltip.razor');
          const extensions = new Set(['.razor', '.html', '.cshtml', '.js', '.mjs', '.ts']);
          const violations = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (ignored.some(fragment => full.includes(fragment))) continue;
              if (entry.isDirectory()) walk(full);
              else if (extensions.has(path.extname(full).toLowerCase())) inspect(full);
            }
          }

          function lineNumber(text, index) {
            return text.slice(0, index).split('\n').length;
          }

          function add(file, text, match, message) {
            violations.push(`${file}:${lineNumber(text, match.index)} ${message}`);
          }

          function inspect(file) {
            const normalized = path.normalize(file);
            const text = fs.readFileSync(file, 'utf8');

            if (/\.razor$|\.html$|\.cshtml$/i.test(file)) {
              const nativeInteractiveTitle = /<(?:button|a|input|select|textarea)\b[^>]*\btitle\s*=/gis;
              for (const match of text.matchAll(nativeInteractiveTitle)) {
                add(file, text, match, 'Interactive native title tooltip is prohibited; use AppTooltip.');
              }
            }

            if (/\.js$|\.mjs$|\.ts$/i.test(file) && normalized !== allowedDirectPortalFile) {
              for (const pattern of [/\bTooltipPortal\s*\./g, /\.title\s*=/g, /setAttribute\(\s*['"]title['"]/g]) {
                for (const match of text.matchAll(pattern)) {
                  add(file, text, match, 'Ad hoc/native tooltip API is prohibited; use AppTooltip.');
                }
              }
              for (const pattern of [/economic-calculator-global-tooltip/g, /\bglobalTooltip\b/g, /\bshowTooltip\s*\(/g, /\bmoveTooltip\s*\(/g]) {
                for (const match of text.matchAll(pattern)) {
                  add(file, text, match, 'Custom tooltip implementation is prohibited; use the canonical AppTooltip portal.');
                }
              }
            }

            if (normalized !== allowedCursorHelpFile) {
              for (const match of text.matchAll(/cursor-help/g)) {
                add(file, text, match, 'Tooltip trigger styling belongs in AppTooltip.');
              }
            }
          }

          for (const root of roots) {
            if (fs.existsSync(root)) walk(root);
          }

          const component = 'SaveNEIN.Client/Components/AppTooltip.razor';
          if (!fs.existsSync(component)) violations.push(`${component}: missing canonical tooltip component`);

          if (violations.length) {
            console.error('Tooltip standard violations found:\n' + violations.map(v => `- ${v}`).join('\n'));
            process.exit(1);
          }

          console.log('Tooltip guard passed. App-owned interactive tooltips use the canonical AppTooltip implementation.');
          '''.replace(/^          /gm, ''))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('scripts', {})['check:tooltips'] = 'node scripts/check-tooltips.mjs'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          write('.github/workflows/tooltip-guard.yml', '''name: Tooltip component guard\n\non:\n  push:\n  pull_request:\n\njobs:\n  check-tooltips:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n\n      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n\n      - name: Enforce canonical tooltips\n        run: npm run check:tooltips\n''')

          hook = read('.githooks/pre-commit')
          if 'npm run check:tooltips' not in hook:
              hook = hook.rstrip() + '\n\nnpm run check:tooltips\n'
          write('.githooks/pre-commit', hook)

          # Remove audit-only files from the finished branch.
          for audit_path in ['.audit-results.txt', '.audit-trigger', '.github/workflows/one-off-ui-audit.yml']:
              p = Path(audit_path)
              if p.exists(): p.unlink()

      - name: Validate tooltip policy and existing UI guard
        run: |
          npm run check:tooltips
          npm run check:ui-text

      - name: Build Blazor/server projects
        run: dotnet build SaveNEIN.Server/SaveNEIN.Server.csproj -c Release

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): standardize custom options and tooltips" || exit 0
          git push
