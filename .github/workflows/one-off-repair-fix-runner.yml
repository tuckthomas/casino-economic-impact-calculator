name: One-off repair UI fix runner

on:
  push:
    branches:
      - agent/issues-10-11-ui-standardization

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair Python source in one-off fix workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/one-off-issues-10-11-fix.yml')
          text = p.read_text(encoding='utf-8')
          old = "'''.replace(/^          /gm, ''))"
          new = "'''.replace('          ', ''))"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one broken replacement, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-off-issues-10-11-fix.yml
          git commit -m "chore: repair UI fix runner"
          git push
