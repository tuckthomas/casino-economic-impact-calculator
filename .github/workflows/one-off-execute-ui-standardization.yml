name: One-off execute UI standardization

on:
  push:
    branches:
      - agent/issues-10-11-ui-standardization

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute audited patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/one-off-issues-10-11-fix.yml').read_text(encoding='utf-8')
          workflow = workflow.replace("'''.replace(/^          /gm, ''))", "'''.replace('          ', ''))")

          section = workflow.index('      - name: Apply UI standardization')
          start = workflow.index('        run: |\n', section) + len('        run: |\n')
          end = workflow.index('\n      - name: Validate tooltip policy', start)
          block = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'audited-ui-standardization.py', 'exec'))

          # Two additional map-option rows also used native title tooltips and were
          # identified by the guard after the first audited pass.
          map_path = Path('SaveNEIN.Client/wwwroot/js/components/maplibre-map.js')
          map_text = map_path.read_text(encoding='utf-8')
          dark_old = "            darkModeToggle.closest('.toggle-row')?.classList.toggle('is-disabled', !darkModeSupported);\n            darkModeToggle.closest('.toggle-row')?.setAttribute('title', darkModeSupported ? '' : 'Dark mode is available on Streets and Terrain basemaps.');"
          dark_new = "            const darkModeRow = darkModeToggle.closest('.toggle-row');\n            darkModeRow?.classList.toggle('is-disabled', !darkModeSupported);\n            if (darkModeRow && window.AppTooltip)\n            {\n                if (darkModeSupported) window.AppTooltip.detach(darkModeRow);\n                else window.AppTooltip.attach(darkModeRow, 'Dark mode is available on Streets and Terrain basemaps.');\n            }"
          terrain_old = "            terrainToggle.closest('.toggle-row')?.classList.add('is-disabled');\n            terrainToggle.closest('.toggle-row')?.setAttribute('title', '3D terrain is not available in the current map configuration.');"
          terrain_new = "            const terrainRow = terrainToggle.closest('.toggle-row');\n            terrainRow?.classList.add('is-disabled');\n            if (terrainRow && window.AppTooltip)\n            {\n                window.AppTooltip.attach(terrainRow, '3D terrain is not available in the current map configuration.');\n            }"
          if map_text.count(dark_old) != 1:
              raise SystemExit(f'Dark-mode tooltip migration expected one match, found {map_text.count(dark_old)}')
          if map_text.count(terrain_old) != 1:
              raise SystemExit(f'Terrain tooltip migration expected one match, found {map_text.count(terrain_old)}')
          map_text = map_text.replace(dark_old, dark_new, 1).replace(terrain_old, terrain_new, 1)
          map_path.write_text(map_text, encoding='utf-8')

          # The audited patch creates the permanent tooltip guard, but Actions tokens
          # cannot push workflow-file changes. The connector-side cleanup commit adds it.
          Path('.github/workflows/tooltip-guard.yml').unlink(missing_ok=True)

          # Do not stage deletion of this temporary audit workflow from an Actions token.
          subprocess.run(['git', 'restore', '.github/workflows/one-off-ui-audit.yml'], check=True)

      - name: Validate tooltip and UI policies
        run: |
          npm run check:tooltips
          npm run check:ui-text

      - name: Build release
        run: dotnet build SaveNEIN.Server/SaveNEIN.Server.csproj -c Release

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): standardize custom options and tooltips"
          git push
