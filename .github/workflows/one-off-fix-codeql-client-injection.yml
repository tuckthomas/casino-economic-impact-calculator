name: One-off fix CodeQL client injection

on:
  push:
    branches:
      - agent/codeql-client-injection-hardening

permissions:
  contents: write
  security-events: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply client-side injection fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          calc = Path('SaveNEIN.Client/wwwroot/js/economics/calculator.js')
          text = calc.read_text(encoding='utf-8')
          replacements = {
              "const t1Rate = document.getElementById('rate-t1') ? document.getElementById('rate-t1').textContent : \"-%\";": "const t1Rate = `${(rate * 2 + baselineIncrease).toFixed(2)}%`;",
              "const t2Rate = document.getElementById('rate-t2') ? document.getElementById('rate-t2').textContent : \"-%\";": "const t2Rate = `${(rate * 1.5 + baselineIncrease).toFixed(2)}%`;",
              "const t3Rate = document.getElementById('rate-t3') ? document.getElementById('rate-t3').textContent : \"-%\";": "const t3Rate = `${(rate + baselineIncrease).toFixed(2)}%`;"
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one calculator replacement, found {text.count(old)} for {old}')
              text = text.replace(old, new, 1)
          calc.write_text(text, encoding='utf-8')

          pdf = Path('SaveNEIN.Client/wwwroot/js/pdf-helper.js')
          text = pdf.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>[ \t]*)let liText = clone\.innerHTML;\r?\n'
              r'(?P=indent)liText = liText\.replace\(/<\(strong\|b\)>\(\.\*\?\)<\\/\\1>/gi, "\*\*\$2\*\*"\);\r?\n'
              r'(?P=indent)liText = liText\.replace\(/<\[\^>\]\+>/g, ""\); // Strip other tags\r?\n'
              r'(?P=indent)liText = liText\.trim\(\);'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Expected PDF regex sanitizer block was not found')
          indent = match.group('indent')
          lines = [
              'const toMarkdownText = (node) =>',
              '{',
              '    return Array.from(node.childNodes).map(childNode =>',
              '    {',
              '        if (childNode.nodeType === Node.TEXT_NODE)',
              '        {',
              '            return childNode.textContent || "";',
              '        }',
              '',
              '        if (childNode.nodeType !== Node.ELEMENT_NODE)',
              '        {',
              '            return "";',
              '        }',
              '',
              '        const tagName = childNode.tagName;',
              "        if (tagName === 'UL' || tagName === 'OL')",
              '        {',
              '            return "";',
              '        }',
              '',
              '        const childText = toMarkdownText(childNode);',
              "        return tagName === 'STRONG' || tagName === 'B'",
              '            ? `**${childText}**`',
              '            : childText;',
              "    }).join('');",
              '};',
              '',
              "const liText = toMarkdownText(clone).replace(/\\s+/g, ' ').trim();"
          ]
          replacement = '\n'.join(indent + line if line else '' for line in lines)
          text = text[:match.start()] + replacement + text[match.end():]
          pdf.write_text(text, encoding='utf-8')

      - name: Validate JavaScript syntax
        run: |
          node --check SaveNEIN.Client/wwwroot/js/economics/calculator.js
          node --check SaveNEIN.Client/wwwroot/js/pdf-helper.js

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript without upload
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never

      - name: Verify target findings are gone
        shell: python
        run: |
          import glob, json
          blocked = {'js/xss-through-dom', 'js/incomplete-multi-character-sanitization'}
          paths = glob.glob('sarif-results/**/*.sarif', recursive=True)
          if not paths:
              raise SystemExit('No SARIF output found')
          hits = []
          for path in paths:
              data = json.load(open(path, encoding='utf-8'))
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      if result.get('ruleId') in blocked:
                          loc = result.get('locations', [{}])[0].get('physicalLocation', {})
                          hits.append((result.get('ruleId'), loc.get('artifactLocation', {}).get('uri'), loc.get('region', {}).get('startLine')))
          if hits:
              raise SystemExit(f'Target CodeQL findings still present: {hits}')
          print('Target JavaScript CodeQL findings are gone.')

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SaveNEIN.Client/wwwroot/js/economics/calculator.js SaveNEIN.Client/wwwroot/js/pdf-helper.js
          git commit -m "fix(security): harden generated analysis content"
          git push
